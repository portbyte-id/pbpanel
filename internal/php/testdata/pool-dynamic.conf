; Managed by PB panel for a.test (PHP pool). Rewritten on every save.
[a_test]
user = www
group = www
listen = /www/panel/run/php-8.3-a_test.sock
listen.owner = www
listen.group = www
listen.mode = 0660
chdir = /www/services/sites/a.test

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /www/panel/logs/sites/a.test.php.log
