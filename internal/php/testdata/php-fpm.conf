; Managed by PB panel. Rewritten when it differs; edit pools and php.ini instead.
[global]
error_log = /proc/self/fd/2
daemonize = no

; FPM does not start without a pool. This one serves no site; it keeps the
; container up when the last PHP site on this version is removed.
[panel_idle]
user = www
group = www
listen = /www/panel/run/php-8.3-panel_idle.sock
listen.owner = www
listen.group = www
listen.mode = 0600
pm = ondemand
pm.max_children = 1

include = /www/panel/php/8.3/pool.d/*.conf
