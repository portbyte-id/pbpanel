# Managed by PB panel (TLS). Rewritten when the certificate changes.
listen 443 ssl;
listen 443 quic reuseport;
listen [::]:443 ssl;
listen [::]:443 quic reuseport;
http2 on;
http3 on;

ssl_certificate /www/panel/ssl/sites/a.test/fullchain.pem;
ssl_certificate_key /www/panel/ssl/sites/a.test/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
