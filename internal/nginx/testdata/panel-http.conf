# Managed by PB panel (Nginx settings). Rewritten on every save; edit it there.
log_format pbpanel '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time rid=$request_id';

# The firewall's zones and maps, one file per site.
include /www/panel/nginx/waf/http/*.conf;

client_max_body_size 100m;
client_body_timeout 60s;
client_header_timeout 60s;
keepalive_timeout 65s;
send_timeout 60s;
server_tokens off;

gzip on;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml image/svg+xml;
