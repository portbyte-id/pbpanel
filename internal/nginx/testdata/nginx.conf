# Generated once by PB panel; from here on this file is yours to edit.
# The include lines below connect it to the settings form and to the sites.
# Remove one and the panel tells you which feature stopped working.
user www;
pid /run/nginx.pid;
error_log /dev/stderr warn;
include /www/panel/nginx/panel-main.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Sites open their own logs; this keeps a site without one from logging here.
    access_log off;

    # Lets a proxy site pass WebSocket upgrades through.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /www/panel/nginx/panel-http.conf;

    # Requests for a host no site claims get no answer instead of the first site.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # An IP-address certificate is validated against the bare address, which
        # no site claims, so the challenge path is answered here.
        location ^~ /.well-known/acme-challenge/ {
            root /www/panel/ssl/acme-webroot;
            default_type text/plain;
            try_files $uri =404;
        }
        location / {
            return 444;
        }
    }

    include /www/panel/nginx/sites/*.conf;
}
