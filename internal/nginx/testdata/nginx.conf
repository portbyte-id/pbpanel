# Generated once by PB panel; from here on this file is yours to edit.
# The include lines below connect it to the settings form and to the sites.
# Remove one and the panel tells you which feature stopped working.
user www;
pid /run/nginx.pid;
error_log /www/panel/logs/nginx-error.log warn;
include /www/panel/nginx/panel-main.conf;

events {
    worker_connections 1024;
}

http {
    include /www/panel/nginx/current/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Sites open their own logs; this keeps a site without one from logging here.
    access_log off;

    # Lets a proxy site pass WebSocket upgrades through.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /www/panel/nginx/panel-http.conf;

    # Requests for a host no site claims get a landing page instead of the first site.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # An IP-address certificate is validated against the bare address, which
        # no site claims, so the challenge path is answered here.
        location ^~ /.well-known/acme-challenge/ {
            root /www/panel/ssl/acme-webroot;
            default_type text/plain;
            try_files $uri =404;
        }
        location / {
            default_type text/html;
            return 200 '<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content=width=device-width,initial-scale=1>
<title>No website configured</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#111}
main{max-width:30rem;padding:2rem;text-align:center}
h1{font-size:1.25rem;margin:0 0 .5rem}
p{margin:0;color:#555}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}p{color:#aaa}}
</style>
<main>
<h1>No website is configured for this address</h1>
<p>Served by PB Panel</p>
</main>
';
        }
    }

    include /www/panel/nginx/sites/*.conf;
}
