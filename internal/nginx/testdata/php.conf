# Managed by PB panel (PHP version and pool).
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    try_files $uri =404;
    include /www/panel/nginx/current/conf/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/www/panel/run/php-8.3-c_test.sock;
}
