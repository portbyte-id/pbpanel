# Managed by PB panel (TLS). Rewritten when the certificate changes.
listen 443 ssl;
listen [::]:443 ssl;
http2 on;

ssl_certificate /www/panel/ssl/sites/a.test/fullchain.pem;
ssl_certificate_key /www/panel/ssl/sites/a.test/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

set $pb_https_redirect "";
if ($scheme = http) {
    set $pb_https_redirect 1;
}
if ($uri ~ ^/\.well-known/acme-challenge/) {
    set $pb_https_redirect "";
}
if ($pb_https_redirect) {
    return 301 https://$host$request_uri;
}
