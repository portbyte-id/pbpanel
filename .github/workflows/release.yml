name: Release

# Pushing a v* tag publishes the binaries that install.sh downloads.
#   git tag v0.2.0 && git push gh v0.2.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:

  release:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The binary embeds web/dist, so the SPA is built first.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build the binaries
        run: |
          set -eu
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/portbyte-id/server-panel/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "pbp-linux-$arch" ./cmd/panel
          done
          sha256sum pbp-linux-amd64 pbp-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The release body is the annotated tag's message. A lightweight tag
          # has none, so the release falls back to GitHub's generated notes.
          git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$notes"
          if [ -s "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            pbp-linux-amd64 pbp-linux-arm64 SHA256SUMS install.sh \
            --title "$GITHUB_REF_NAME" "${notes_args[@]}"
