name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow, so a tag cannot publish a build that fails it.
  workflow_call:

jobs:
  go:
    name: Go build, vet, test (${{ matrix.runner }})
    # v1 supports amd64 and arm64, so the tests run natively on both.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web

  static:
    name: Static linux binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w" -o pbp-linux-${{ matrix.arch }} ./cmd/panel
      - name: Assert the binary is static
        run: |
          set -eu
          bin=pbp-linux-${{ matrix.arch }}
          file "$bin"
          if ! file "$bin" | grep -q "statically linked"; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          if readelf -l "$bin" | grep -q "INTERP"; then
            echo "::error::$bin has a dynamic loader"
            exit 1
          fi

  lint:
    name: Conventions and linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Convention greps
        run: sh scripts/lint-conventions.sh
      - name: gofmt
        run: |
          set -eu
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: golangci-lint
        run: |
          set -eu
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run
