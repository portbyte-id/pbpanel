name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web

  static:
    name: Static linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o pbp-linux-amd64 ./cmd/panel
      - name: Assert the binary is static
        run: |
          set -eu
          file pbp-linux-amd64
          if ! file pbp-linux-amd64 | grep -q "statically linked"; then
            echo "::error::pbp-linux-amd64 is not statically linked"
            exit 1
          fi
          if readelf -l pbp-linux-amd64 | grep -q "INTERP"; then
            echo "::error::pbp-linux-amd64 has a dynamic loader"
            exit 1
          fi

  lint:
    name: Conventions and linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Convention greps
        run: sh scripts/lint-conventions.sh
      - name: gofmt
        run: |
          set -eu
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: golangci-lint
        run: |
          set -eu
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run
